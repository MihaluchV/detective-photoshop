<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Справа про зіпсований постер</title>
<style>
:root{--bg:#f4f5fa;--fg:#1a1a2e;--card:#fff;--ac:#3b5bdb;--mu:#667;--ok:#2b8a3e;--er:#c92a2a;--bd:#d5d8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151f;--fg:#e8e9f3;--card:#1f2133;--ac:#7c93ff;--mu:#9aa;--ok:#51cf66;--er:#ff6b6b;--bd:#34374d}}
:root[data-theme="dark"]{--bg:#14151f;--fg:#e8e9f3;--card:#1f2133;--ac:#7c93ff;--mu:#9aa;--ok:#51cf66;--er:#ff6b6b;--bd:#34374d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:1000px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:0 0 10px}h2{margin:.2em 0}h3{margin:.2em 0}
.g{display:block}
.a{max-width:560px;margin:0 auto 14px}.b{max-width:760px;margin:0 auto}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
svg#art{width:100%;height:auto;border-radius:10px;display:block;background:#000;transition:filter .8s}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:8px;padding:8px 12px;margin:4px 4px 4px 0}
button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.45;cursor:default}
button.o{display:block;width:100%;text-align:left}
input[type=text]{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);margin:3px 3px 3px 0;max-width:100%}
.m{color:var(--mu);font-size:13px}
.su{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ch{font-size:13px;border:1px solid var(--bd);border-radius:99px;padding:3px 10px;background:var(--card)}
.ch.ok{border-color:var(--ok);color:var(--ok);text-decoration:line-through}
.ch.gu{border-color:var(--er);color:var(--er);font-weight:700}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--ac);transition:width .5s}
#fb{min-height:24px;margin-top:6px;font-weight:600}.er{color:var(--er)}.ok{color:var(--ok)}
.hn{background:var(--bg);border-left:3px solid var(--ac);padding:6px 10px;margin-top:6px;border-radius:4px}
.cl{background:var(--bg);border:1px dashed var(--ac);border-radius:8px;padding:10px;margin:8px 0}
.sw{width:100%;height:36px;border-radius:8px;border:1px solid var(--bd);margin:6px 0}
input[type=range]{width:100%}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:4px 6px;text-align:left}
.ly{display:flex;align-items:center;gap:8px;border:1px solid var(--bd);border-radius:6px;padding:6px 8px;margin:3px 0;background:var(--bg);cursor:grab;user-select:none;touch-action:none}.ly.dg{outline:2px solid var(--ac);opacity:.85;cursor:grabbing}.th{width:34px;height:24px;border-radius:3px;border:1px solid var(--bd)}.ph{font-size:13px;font-weight:600;padding:4px 8px;background:var(--bd);border-radius:6px 6px 0 0}#ol{border:1px solid var(--bd);border-radius:6px;padding:4px;touch-action:none}
#ts{width:100%;height:auto;border-radius:8px;display:block;touch-action:none;cursor:crosshair;border:1px solid var(--bd);margin:6px 0}button.act{background:var(--ac);color:#fff;border-color:var(--ac)}
</style>
</head>

<h1>🔍 Справа про зіпсований постер</h1>
<div class="g">
<div class="a">

<text id="ti" x="200" y="30" text-anchor="middle" font-size="22" font-weight="700" fill="#fff" opacity=".08">ВЕСНЯНА ВИСТАВКА</text>
<g id="sgn" opacity="0"><rect x="215" y="250" width="180" height="24" rx="5" fill="#000" fill-opacity=".6"/><text x="305" y="266" text-anchor="middle" font-size="11" fill="#fff">Прихований шар: «Автор — Макс»</text></g>

</svg>

</div>

</div>

<script>
const SU=['Тарас, охоронець','Макс, адміністратор','Олена, художниця','Іван, вчитель'];
const L=[
{t:'Виділення',st:'Перший огляд: на файлі видно вирізані ділянки з різкими краями. Зловмисник працював інструментами виділення.',cl:'Усі виділення зроблені на комп\u2019ютері в кабінеті №12 після 18:00. Охоронець Тарас у цей час був на вахті — він чистий.',ok:0,s:[
{q:'Потрібно виділити однотонне небо одним клацанням, не обводячи вручну. Який інструмент?',o:['Magic Wand (Чарівна паличка)','Polygonal Lasso (Багатокутне ласо)','Elliptical Marquee (Овальна область)','Move (Переміщення)'],h:'Він виділяє суміжні пікселі подібного кольору.'},
{q:'Дах будинку має прямі краї. Чим його точно обвести клацаннями по вершинах?',o:['Polygonal Lasso (Багатокутне ласо)','Magic Wand (Чарівна паличка)','Elliptical Marquee (Овальна область)','Crop (Рамка)'],h:'Кожне клацання ставить вершину багатокутника.'},
{q:'Як зробити ідеально круглу область виділення навколо сонця?',o:['Elliptical Marquee (Овальна область) з утриманим Shift','Rectangular Marquee (Прямокутна область)','Lasso (Ласо) з Alt','Crop (Рамка)'],h:'Shift фіксує пропорції 1:1.'}]},
{t:'Трансформації',st:'Фрагмент із будинком повернули й віддзеркалили. Крім того, розібрано на частини дерево біля школи. Усе потрібно зібрати знову.',cl:'У файлі залишився слід облікового запису «Student_Lab». Під підозрою адміністратор Макс і художниця Олена. Дерево знову росте на постері.',ok:-1,s:[

{q:'Яка команда віддзеркалює шар по горизонталі?',o:['Edit (Редагування) › Transform (Трансформування) › Flip Horizontal (Віддзеркалити по горизонталі)','Image (Зображення) › Image Size (Розмір зображення)','Select (Виділення) › Inverse (Інверсія)','Filter (Фільтр) › Blur (Розмиття)'],h:'Шукай у меню Edit (Редагування), підменю Transform (Трансформування).'},
{t:'tf',q:'Поверніть будинок на постері: кнопками поверніть на 90° і віддзеркальте так, щоб він став на місце (димар праворуч, дах зверху).',h:'Потрібен один поворот на 90° за годинниковою стрілкою і одне віддзеркалення.'},
{t:'tree',q:'Дерево біля школи розібране на частини. Зберіть його: інструментом Виділення (Selection) виділіть елемент, Переміщенням (Move) перетягніть на місце, а Трансформацією (Transform) поверніть, віддзеркальте або змініть розмір. Блідий контур показує, де має бути елемент. На дереві має бути 3 яблука: виділіть яблуко й створіть копії командою Дублювати (Duplicate). Гілка має торкатися стовбура, а листя на ній — крони. Порядок відображення змінюйте кнопками Вперед/Назад: яблука й гілка мають бути зверху, а велика крона закриває бічні частини.',h:'Спершу виділіть елемент, тоді переміщуйте й трансформуйте. Гілку треба віддзеркалити й повернути. Яблуко виділіть і натисніть Дублювати (Duplicate) двічі. Допуск: приблизно 20 пікселів і один крок повороту чи розміру. Порядок знизу вгору: стовбур, бічні частини крони, велика крона, гілка й яблука. Велика крона темно-зелена, з овальною світлою плямою й темними крапками. Ліва частина світліша, з ромбом, права — з трикутником і кільцем.'}]},
{t:'Колір',st:'Кольори зіпсовано: усе зсунуто за відтінком. Свідки дали колір сонця у HEX-коді.',cl:'Профіль CMYK — друкарський. Вчитель Іван працює лише в ньому, а тут RGB. Іван чистий.',ok:3,s:[
{q:'Яка колірна модель підходить для зображень, що показуються на екрані?',o:['RGB','CMYK','Grayscale (Відтінки сірого)','Bitmap (Бітова карта)'],h:'Червоний, зелений, синій.'},
{t:'col',q:'Відновіть колір сонця #F2A33A: виставте відповідні значення R, G, B (допуск ±8).',hex:[242,163,58],h:'HEX — три пари цифр: R, G, B у шістнадцятковій системі. F2 = 242.'},
{q:'Яка клавіша скидає кольори переднього плану й фону до чорного та білого?',o:['D','X','G','Alt'],h:'Default colors (кольори за замовчуванням).'}]},
{t:'Заливка і градієнт',st:'Небо стало сірим, а сяйво навколо сонця зникло.',cl:'Градієнт створено за шаблоном з профілю художниці Олени. Усі докази вказують на неї!',ok:-1,s:[
{q:'Небо плавно темнішає від горизонту вгору. Який тип градієнта потрібен?',o:['Linear (Лінійний)','Radial (Радіальний)','Angle (Кутовий)','Diamond (Ромбовидний)'],h:'Перехід іде по прямій лінії.'},
{q:'Для м\u2019якого сяйва довкола сонця потрібен градієнт:',o:['Radial (Радіальний)','Linear (Лінійний)','Reflected (Відбитий)','Angle (Кутовий)'],h:'Колір розходиться від центру колом.'},
{q:'Paint Bucket (Заливка) з малим значенням Tolerance (Допуск) залиє:',o:['Лише пікселі, дуже схожі на клікнутий','Усе зображення','Лише виділену область','Нічого'],h:'Tolerance — допустима різниця кольорів.'}]},
{t:'Пензлі',st:'Зникли мазки: хмари й трава. Аналіз показує слід пензля.',cl:'Мазки зроблені жорстким пензлем, а Олена завжди малює м\u2019яким. Це не вона! Тоді чий це слід?',ok:2,s:[
{q:'Яке значення Hardness (Жорсткість) дає найм\u2019якший край пензля?',o:['0%','50%','100%','Hardness (Жорсткість) не впливає на край'],h:'Чим менше значення, тим розмитіший край.'},
{q:'Якими клавішами швидко змінюють розмір пензля?',o:['[, ] або Х, Ї','Ctrl+Z','Tab','F5'],h:'Клавіша [ (Х) зменшує пензель, а ] (Ї) збільшує. Це одні й ті самі клавіші в англійській та українській розкладках.'},
{q:'Як тимчасово вибрати колір із зображення, не виходячи з пензля?',o:['Утримувати Alt (піпетка Eyedropper)','Утримувати Shift','Утримувати Ctrl','Натиснути Space'],h:'Тимчасово вмикається Eyedropper (Піпетка).'}]},
{t:'Шари та стилі',st:'Фінальний файл: шари переплутано, а один із них прихований.',cl:'',ok:-1,s:[
{t:'ord',q:'Перетягніть шари мишкою в панелі Layers (Шари) так, щоб зверху вниз вони йшли в правильному порядку (верхній шар перекриває нижні): підпис, будинок, гори, сонце, небо.',it:['Підпис (текст)','Будинок','Гори','Сонце','Небо'],h:'Небо — найдальший фон, підпис — зверху всього.'},
{q:'Який режим накладання затемнює зображення, перемножуючи кольори?',o:['Multiply (Множення)','Screen (Освітлення)','Overlay (Перекриття)','Normal (Звичайний)'],h:'Назва перекладається як «множення».'},
{q:'Який стиль шару додає тінь під об\u2019єктом?',o:['Drop Shadow (Тінь)','Stroke (Обвідка)','Bevel & Emboss (Фаска і рельєф)','Color Overlay (Накладання кольору)'],h:'Drop — «падати», shadow — тінь.'}]}
];
const $=i=>document.getElementById(i);
let S={ph:'start',lv:0,st:0,e:0,h:0,hu:0,rot:270,fl:true,lg:L.map(()=>({p:0,e:0,h:0})),sp:[0,0,0,0],info:{}};
function house(){$('hs').setAttribute('transform',`translate(110 215) scale(${S.fl?-1:1} 1) rotate(${S.rot}) translate(-110 -215)`)}
function art(k){
 const b=5*(6-k)/6;
 $('art').style.filter=`blur(${b}px)${k<3?' hue-rotate(140deg) saturate(.3)':''}`;
 $('nr').setAttribute('opacity',.5*(6-k)/6);
 if(k>=1){$('mt').setAttribute('fill','#4d6b5a');$('mt').setAttribute('stroke','none')}
 if(k>=4){$('sky').setAttribute('fill','url(#sg)');$('sunG').setAttribute('opacity',1)}
 if(k>=2)$('tr').style.opacity=1;
 if(k>=5)$('stk').setAttribute('opacity',1);
 if(k>=6){$('ti').setAttribute('opacity',1);$('ti').setAttribute('filter','url(#ds)')}
 $('pb').style.width=Math.round(k/6*100)+'%';$('pt').textContent='Відновлення постера: '+Math.round(k/6*100)+'%';
}
function sus(){$('su').innerHTML=SU.map((n,i)=>`<span class="ch ${['','ok','gu'][S.sp[i]]}">${S.sp[i]==1?'✔ ':S.sp[i]==2?'⚠ ':'? '}${n}</span>`).join('')}
function R(){
 const p=$('p');
 if(S.ph=='start'){p.innerHTML=`<h2>Справа №10</h2><p>У школі перед відкриттям цифрової виставки хтось пошкодив постер-переможець конкурсу. Ти — стажер-детектив. Розв\u2019язуй завдання з Photoshop, відновлюй зображення й знайди винного. Підказки допомагають, але знімають бали.</p><input type="text" id="sn" placeholder="Прізвище"><input type="text" id="fn" placeholder="Ім\u2019я"><input type="text" id="cl" placeholder="Клас" size="6"><br><button class="p" onclick="go()">Розпочати розслідування</button><div id="fb" class="er"></div>`;return}
 const v=L[S.lv];
 if(S.ph=='intro'){p.innerHTML=`<div class="m">Рівень ${S.lv+1} з 6</div><h2>${v.t}</h2><p>${v.st}</p><button class="p" onclick="S.ph='step';R()">До завдань</button>`;return}
 if(S.ph=='clue'){p.innerHTML=`<div class="m">Рівень ${S.lv+1} пройдено</div><h3>Нова улика</h3><div class="cl">${v.cl}</div><p class="ok">Частину постера відновлено.</p><button class="p" onclick="nx()">Далі</button>`;return}
 if(S.ph=='end'){fin();return}
 const s=v.s[S.st];S.hu=0;S.e=0;
 let h=`<div class="m">Рівень ${S.lv+1}: ${v.t} · завдання ${S.st+1}/${v.s.length}</div><p><b>${s.q}</b></p>`;
 if(!s.t){S.o=s.o.map((t,i)=>[t,i]).sort(()=>Math.random()-.5);h+=S.o.map(([t,i],j)=>`<button class="o" onclick="pick(${i},this)">${t}</button>`).join('')}
 else if(s.t=='col'){S.c=[128,128,128];h+=`<div class="m">Цільовий колір: <b>#F2A33A</b></div><div class="sw" id="sw"></div>`+['R','G','B'].map((c,i)=>`${c}: <b id="v${i}">128</b><input type="range" min="0" max="255" value="128" oninput="sl(${i},this.value)">`).join('')+`<button class="p" onclick="chk()">Перевірити</button>`;setTimeout(()=>sl(0,128),0)}
 else if(s.t=='tf'){h+=`<button onclick="S.rot=(S.rot+90)%360;house()">↻ Повернути 90°</button><button onclick="S.fl=!S.fl;house()">⇋ Віддзеркалити</button><button class="p" onclick="chk()">Перевірити</button>`}
 else if(s.t=='tree'){S.dn=0;S.sel=new Set();S.tl=0;T={};P=[5,3,1,2,0,4].map(k=>D[k]).map(d=>({...d,c:{x:d.i[0],y:d.i[1],r:d.i[2],s:d.i[3],f:!!d.i[4]}}));
  const ap=D.find(d=>d.k=='a'),gl=D.filter(d=>!d.k).map(d=>[d.g,d.t,d.b]).concat(AT.map(a=>[ap.g,[a[0],a[1],0],[30,30]]));
  const gh=gl.map(([g,t,b])=>`<g opacity=".5" pointer-events="none" transform="translate(${t[0]} ${t[1]}) rotate(${t[2]})">${g}</g>`).join('');
  h+=`<div><button id="t0" onclick="tool(0)">▭ Виділення (Selection)</button><button id="t1" onclick="tool(1)">✥ Переміщення (Move)</button><button onclick="dup()">⧉ Дублювати (Duplicate)</button></div><svg id="ts" viewBox="0 0 400 280" onpointerdown="tdown(event)" onpointermove="tmove(event)" onpointerup="tup(event)" onpointercancel="tup(event)"><rect width="400" height="280" fill="#cfe8ff"/><rect y="245" width="400" height="35" fill="#6bb36b"/>${gh}<g id="pcs"></g><rect id="mq" display="none" fill="rgba(34,139,230,.15)" stroke="#228be6" stroke-dasharray="4 3"/></svg><div class="m">Трансформація (Transform) виділеного елемента:</div><button onclick="xf('r',-15)">↺ 15°</button><button onclick="xf('r',15)">↻ 15°</button><button onclick="xf('f')">⇋ Віддзеркалити</button><button onclick="xf('s',-.1)">− Менше</button><button onclick="xf('s',.1)">＋ Більше</button><div class="m">Порядок відображення (Arrange) виділеного елемента:</div><button onclick="zo('b')">⤓ На задній план (Send to Back)</button><button onclick="zo('d')">↓ Назад (Send Backward)</button><button onclick="zo('u')">↑ Вперед (Bring Forward)</button><button onclick="zo('f')">⤒ На передній план (Bring to Front)</button><br><button class="p" onclick="chk()">Перевірити</button>`;setTimeout(()=>{tool(0);tbuild()},0)}
 else if(s.t=='ord'){S.or=[2,4,0,3,1];h+=`<div id="ol"></div><button class="p" onclick="chk()">Перевірити</button>`;setTimeout(ol,0)}
 h+=`<div><button onclick="hint()">💡 Підказка (−2)</button></div><div id="hn"></div><div id="fb"></div>`;
 p.innerHTML=h;
}
const TC=['#f1c40f','#c0504d','#4d6b5a','#F2A33A','#1e3a8a'];
function ol(){
 const o=$('ol'),it=L[5].s[0].it;
 o.innerHTML='<div class="ph">Layers (Шари) — перетягуйте шари мишкою</div>'+S.or.map(x=>`<div class="ly" data-i="${x}"><span>👁</span><span class="th" style="background:${TC[x]}"></span><span>${it[x]}</span></div>`).join('');

 o.onpointerdown=e=>{const r=e.target.closest('.ly');if(!r)return;dr=r;r.classList.add('dg');o.setPointerCapture(e.pointerId);e.preventDefault()};
 o.onpointermove=e=>{if(!dr)return;let bf=null;for(const x of o.querySelectorAll('.ly')){if(x===dr)continue;const b=x.getBoundingClientRect();if(e.clientY<b.top+b.height/2){bf=x;break}}

function sl(i,v){S.c[i]=+v;$('v'+i).textContent=v;$('sw').style.background=`rgb(${S.c})`}
function hint(){const s=L[S.lv].s[S.st];if(!S.hu){S.hu=1;S.h++}$('hn').innerHTML=`<div class="hn">${s.h}</div>`}

 r?ok():bad();

 const v=L[S.lv];S.st++;

 if(!a||!b||!c){$('fb').textContent='Заповніть прізвище, ім\u2019я та клас.';return}

}
function fin(){
 S.sp=[1,2,1,1];sus();$('sgn').setAttribute('opacity',1);
 const tot=S.lg.reduce((a,g)=>a+g.p,0),mx=L.reduce((a,v)=>a+v.s.length,0)*10,er=S.lg.reduce((a,g)=>a+g.e,0),hi=S.lg.reduce((a,g)=>a+g.h,0);
 S.tot=tot;S.mx=mx;S.er=er;S.hi=hi;
 $('p').innerHTML=`<h2>Справу розкрито!</h2><div class="cl">У панелі шарів знайшовся прихований шар. Це не випадкове пошкодження: адміністратор <b>Макс</b> навмисно зіпсував постер Олени, а під шаром «Фон» сховав власну роботу, щоб підмінити переможця. Підпис у прихованому шарі видав його. Олена, Тарас та Іван — невинні, а постер відновлено повністю.</div>
 <h3>Результат: ${tot} з ${mx}</h3><table><tr><th>Рівень</th><th>Бали</th><th>Помилки</th><th>Підказки</th></tr>${L.map((v,i)=>`<tr><td>${v.t}</td><td>${S.lg[i].p}</td><td>${S.lg[i].e}</td><td>${S.lg[i].h}</td></tr>`).join('')}</table>
 <button class="p" onclick="send()" id="sb">Надіслати результат вчителю</button><button onclick="save()">Зберегти результат</button><div id="fb"></div>`;
}
const URL_='https://script.google.com/macros/s/AKfycby5JuoBDhkyMaeFKb3bjrhbHsIZIhM4f741IKFEZzoxtfYlNnycEXdbmtxjUtl1QQYyRw/exec';
const KEY='змініть-на-свій-ключ',PROJ='Справа про зіпсований постер';
function post(o){return fetch(URL_,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(o)})}
function join(){const i=S.info;try{post({key:KEY,task:'Приєднання',fields:{'ПІБ учня':i.sn+' '+i.fn,'Клас':i.cl,'Назва проєкту':PROJ}}).catch(()=>{})}catch(e){}}
function img(){
 const i=S.info,d=new Date(),W=800,H=200+L.length*34+60,c=document.createElement('canvas');c.width=W;c.height=H;

 x.font='18px sans-serif';x.fillText(`${i.sn} ${i.fn}, ${i.cl} · ${d.toLocaleDateString('uk-UA')} ${d.toLocaleTimeString('uk-UA')}`,30,80);
 x.font='bold 22px sans-serif';x.fillText(`Результат: ${S.tot} з ${S.mx} · помилок ${S.er} · підказок ${S.hi}`,30,118);
 x.font='17px sans-serif';L.forEach((v,k)=>{const g=S.lg[k];x.fillText(`${k+1}. ${v.t}: ${g.p} б., помилок ${g.e}, підказок ${g.h}`,30,170+k*34)});
 x.fillStyle='#2b8a3e';x.font='bold 18px sans-serif';x.fillText('Справу розкрито, постер відновлено.',30,H-25);
 return c;
}
function save(){img().toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='result.png';a.click()})}
async function send(){
 const i=S.info,f={'Прізвище':i.sn,'Ім’я':i.fn,'Клас':i.cl,'Бал':S.tot,'Максимум':S.mx,'Помилки':S.er,'Підказки':S.hi};
 L.forEach((v,k)=>{f[v.t]=`${S.lg[k].p} б., помилок ${S.lg[k].e}, підказок ${S.lg[k].h}`});
 $('sb').disabled=true;
 try{
  await post({key:KEY,task:PROJ,fields:f,image:{name:'result_'+i.sn+'_'+i.cl,data:img().toDataURL('image/png').split(',')[1]}});
  $('fb').className='ok';$('fb').textContent='Результат надіслано.';
 }catch(e){$('fb').className='er';$('fb').textContent='Не вдалося надіслати. Збережіть результат і покажіть вчителю.';$('sb').disabled=false}
}
const D=[
{n:'Стовбур',b:[40,114],t:[200,190,0],i:[70,190,30,1,0],nf:1,g:'<path d="M-12 -55L12 -55L18 55L-18 55Z" fill="#7b4a2a"/><circle cx="-4" cy="12" r="5" fill="#5a3520"/>'},
{n:'Ліва частина крони',b:[72,72],t:[152,125,0],i:[70,60,0,1.3,0],nf:1,nr:1,g:'<circle r="35" fill="#3aa35c"/><polygon points="-14,-4 -4,10 -14,24 -24,10" fill="#8fe3a2"/><circle cx="14" cy="14" r="5" fill="#2c8a4a"/>'},
{n:'Права частина крони',b:[72,72],t:[248,125,0],i:[330,170,0,1,0],nf:1,nr:1,g:'<circle r="35" fill="#3aa35c"/><polygon points="8,-26 26,-6 4,-8" fill="#8fe3a2"/><circle cx="-12" cy="12" r="7" fill="none" stroke="#8fe3a2" stroke-width="3"/>'},
{n:'Велика крона',b:[112,112],t:[200,98,0],i:[310,70,0,.7,0],nf:1,nr:1,g:'<circle r="55" fill="#2f8f4e"/><ellipse cx="-20" cy="-24" rx="22" ry="11" transform="rotate(-30 -20 -24)" fill="#5cc47a"/><circle cx="24" cy="20" r="6" fill="#1f6f3a"/><circle cx="34" cy="4" r="4" fill="#1f6f3a"/><circle cx="12" cy="32" r="5" fill="#1f6f3a"/>'},
{n:'Гілка з листям',b:[90,60],t:[155,185,0],i:[110,235,45,1,1],g:'<path d="M32 16L-24 -8" stroke="#7b4a2a" stroke-width="9" stroke-linecap="round"/><path d="M6 4L2 20" stroke="#7b4a2a" stroke-width="5" stroke-linecap="round"/><circle cx="-30" cy="-14" r="15" fill="#3aa35c"/><circle cx="-18" cy="-24" r="10" fill="#58c277"/><circle cx="-38" cy="-4" r="9" fill="#2f8f4e"/>'},
{n:'Яблуко',k:'a',b:[26,26],t:[232,118,0],i:[330,235,0,1.3,0],nf:1,nr:1,g:'<circle r="14" fill="transparent"/><circle r="9" fill="#e03131"/><path d="M0 -9q6 -8 12 -4q-6 6 -12 4Z" fill="#2b8a3e"/>'}];
const AT=[[232,118],[168,92],[205,72]];
let P=[];
let T={};
function tool(n){S.tl=n;$('t0').className=n==0?'act':'';$('t1').className=n==1?'act':'';$('ts').style.cursor=n?'move':'crosshair'}
function tdraw(){P.forEach((p,i)=>{const c=p.c,g=$('pc'+i);g.setAttribute('transform',`translate(${c.x} ${c.y}) rotate(${c.r}) scale(${c.f?-c.s:c.s} ${c.s})`);g.querySelector('.sr').setAttribute('display',S.sel.has(i)?'':'none')})}
function pt(e){const r=$('ts').getBoundingClientRect();return[(e.clientX-r.left)*400/r.width,(e.clientY-r.top)*280/r.height]}
function tmsg(t){$('fb').className='er';$('fb').textContent=t}
function tdown(e){
 const [x,y]=pt(e),g=e.target.closest('[data-p]'),i=g?+g.dataset.p:-1;
 $('ts').setPointerCapture(e.pointerId);
 if(S.tl==0){
  if(i>=0){if(e.shiftKey){S.sel.has(i)?S.sel.delete(i):S.sel.add(i)}else S.sel=new Set([i]);T={};tdraw();selmsg()}
  else T={m:1,x,y,sh:e.shiftKey};
 }else{
  if(i<0||!S.sel.has(i)){tmsg('Переміщення (Move) рухає лише виділені елементи. Спочатку виділіть елемент інструментом Виділення (Selection).');T={};return}
  T={d:1,x,y,o:[...S.sel].map(k=>[k,P[k].c.x,P[k].c.y])};
 }
}
function tmove(e){
 const [x,y]=pt(e);
 if(T.m){const m=$('mq');m.setAttribute('display','');m.setAttribute('x',Math.min(x,T.x));m.setAttribute('y',Math.min(y,T.y));m.setAttribute('width',Math.abs(x-T.x));m.setAttribute('height',Math.abs(y-T.y))}
 if(T.d){T.o.forEach(([k,ox,oy])=>{P[k].c.x=Math.max(0,Math.min(400,ox+x-T.x));P[k].c.y=Math.max(0,Math.min(280,oy+y-T.y))});tdraw()}
}
function tup(e){
 if(T.m){const [x,y]=pt(e),x0=Math.min(x,T.x),x1=Math.max(x,T.x),y0=Math.min(y,T.y),y1=Math.max(y,T.y);
  if(!T.sh)S.sel=new Set();
  P.forEach((p,k)=>{const c=p.c;if(c.x>=x0&&c.x<=x1&&c.y>=y0&&c.y<=y1)S.sel.add(k)});
  $('mq').setAttribute('display','none');tdraw();selmsg()}
 T={}
}
function xf(k,v){
 if(!S.sel.size){tmsg('Спочатку виділіть елемент інструментом Виділення (Selection).');return}
 S.sel.forEach(i=>{const c=P[i].c;if(k=='r')c.r=((c.r+v)%360+360)%360;if(k=='f')c.f=!c.f;if(k=='s')c.s=Math.max(.3,Math.round((c.s+v)*10)/10)});
 $('fb').textContent='';tdraw()
}
function zo(m){
 if(!S.sel.size){tmsg('Спочатку виділіть елемент.');return}
 const so=new Set([...S.sel].map(i=>P[i]));
 if(m=='f')P=P.filter(p=>!so.has(p)).concat(P.filter(p=>so.has(p)));
 else if(m=='b')P=P.filter(p=>so.has(p)).concat(P.filter(p=>!so.has(p)));
 else if(m=='u'){for(let i=P.length-2;i>=0;i--){if(so.has(P[i])&&!so.has(P[i+1])){const t=P[i];P[i]=P[i+1];P[i+1]=t}}}
 else{for(let i=1;i<P.length;i++){if(so.has(P[i])&&!so.has(P[i-1])){const t=P[i];P[i]=P[i-1];P[i-1]=t}}}
 S.sel=new Set(P.map((p,i)=>so.has(p)?i:-1).filter(i=>i>=0));tbuild();selmsg();
}
function selmsg(){$('fb').className='m';$('fb').textContent=S.sel.size?'Виділено: '+[...S.sel].map(i=>P[i].n).join(', '):''}
function tbuild(){$('pcs').innerHTML=P.map((p,i)=>`<g data-p="${i}" id="pc${i}"><title>${p.n}</title>${p.g}<rect class="sr" x="${-p.b[0]/2}" y="${-p.b[1]/2}" width="${p.b[0]}" height="${p.b[1]}" fill="none" stroke="#228be6" stroke-width="2" stroke-dasharray="5 3" display="none"/></g>`).join('');tdraw()}
function dup(){
 if(!S.sel.size){tmsg('Спочатку виділіть елемент, копію якого потрібно створити.');return}
 if(P.length>=12){tmsg('Забагато копій.');return}
 const add=[...S.sel].map(i=>({...P[i],c:{...P[i].c,x:Math.min(395,P[i].c.x+20),y:Math.min(275,P[i].c.y+20)}}));
 S.sel=new Set();add.forEach(a=>{P.push(a);S.sel.add(P.length-1)});
 $('fb').className='ok';$('fb').textContent='Створено копію. Перемістіть її на місце.';tbuild();
}
function treeChk(){
 if(S.dn)return;
 const fit=(c,t,d)=>{const a0=((c.r-(t[2]||0))%360+360)%360,a=a0>180?360-a0:a0;return Math.hypot(c.x-t[0],c.y-t[1])<=22&&(d.nr||a<=15)&&Math.abs(c.s-1)<=.15&&(d.nf||!c.f)};
 const why=(c,t,d)=>{const a0=((c.r-(t[2]||0))%360+360)%360,a=a0>180?360-a0:a0,r=[];if(Math.hypot(c.x-t[0],c.y-t[1])>22)r.push('положення');if(!d.nr&&a>15)r.push('кут');if(Math.abs(c.s-1)>.15)r.push('розмір');if(!d.nf&&c.f)r.push('віддзеркалення');return r.join(', ')};
 const bad=[];let extra=false;
 D.forEach(d=>{if(d.k)return;const ps=P.filter(p=>p.n==d.n);if(ps.length>1)extra=true;if(!ps.some(p=>fit(p.c,d.t,d)))bad.push(d.n+' ('+why(ps[0].c,d.t,d)+')')});
 const ap=P.filter(p=>p.k=='a'),used=new Set();let m=0;
 AT.forEach(t=>{const j=ap.findIndex((p,k)=>!used.has(k)&&fit(p.c,[t[0],t[1],0],p));if(j>=0){used.add(j);m++}});
 if(ap.length>AT.length)extra=true;
 const ix=n=>P.findIndex(p=>p.n==n),zc=ix('Велика крона'),zb=[];
 if(zc<ix('Ліва частина крони')||zc<ix('Права частина крони'))zb.push('велика крона має закривати ліву й праву частини');
 if(ap.some(p=>P.indexOf(p)<zc))zb.push('яблука мають бути над кроною');
 if(ix('Гілка з листям')<ix('Ліва частина крони'))zb.push('гілка має бути над частиною крони');
 const sw=[],na=D.filter(d=>!d.k);
 for(let i=0;i<na.length;i++)for(let j=i+1;j<na.length;j++){const A=P.find(p=>p.n==na[i].n),B=P.find(p=>p.n==na[j].n);
  if(Math.hypot(A.c.x-na[j].t[0],A.c.y-na[j].t[1])<=30&&Math.hypot(B.c.x-na[i].t[0],B.c.y-na[i].t[1])<=30)sw.push([na[i].n,na[j].n])}
 if(!bad.length&&m==AT.length&&!extra&&!zb.length){S.dn=1;$('fb').className='ok';$('fb').textContent='Дерево зібрано!';setTimeout(ok,1300);return}
 S.e++;
 let t='';sw.forEach(x=>{t+='«'+x[0]+'» і «'+x[1]+'» поміняні місцями: кожен має стояти на місці іншого (змініть також розмір). '});
 if(bad.length)t+='Не на місці: '+bad.join(', ')+'. ';
 if(m<AT.length)t+='Яблук на місці: '+m+' з '+AT.length+'. '+(ap.some(p=>Math.abs(p.c.s-1)>.15)?'Розмір яблук має бути як у блідому контурі: зменште їх кнопкою «Менше». ':'');
 if(extra)t+='Є зайві копії елементів: видаліть їх або перемістіть на потрібні місця яблук. ';
 if(zb.length)t+='Порядок відображення: '+zb.join('; ')+'. ';
 tmsg(t.trim());
}
function ptree(){const ap=D.find(d=>d.k=='a');$('tr').innerHTML=D.filter(d=>!d.k).map(d=>`<g transform="translate(${d.t[0]} ${d.t[1]}) rotate(${d.t[2]})">${d.g}</g>`).join('')+AT.map(a=>`<g transform="translate(${a[0]} ${a[1]})">${ap.g}</g>`).join('')}
ptree();house();art(0);sus();R();
